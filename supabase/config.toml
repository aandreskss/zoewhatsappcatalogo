# Configuración de Supabase CLI para desarrollo local.
# Requiere Docker Desktop corriendo. Uso: `supabase start`, luego
# `npm run db:migrate:local` y `npm run db:seed`.
#
# `project_id` es solo una etiqueta local; no es el ID del proyecto remoto
# de Supabase (ese se referencia vía `supabase link` y las variables de
# entorno en .env.local, nunca aquí).
project_id = "zoe-catalog"

[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
